# Reference workflow: activate as .github/workflows/ci.yml.
# The GitHub App needs workflows permission; see ci/README.md.

name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Docker lint + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} -t discord-radio:ci .
      - name: Lint and test inside Docker
        # No .env, Discord token, production services, or external Compose
        # network is needed. Do not run Python or install deps on the host.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" --workdir /app \
            --env HOME=/tmp \
            --env RUFF_CACHE_DIR=/tmp/ruff_cache \
            --env PYTEST_ADDOPTS="-o cache_dir=/tmp/pytest_cache" \
            --entrypoint sh discord-radio:ci -ec '
              python -m ruff check .
              python -m ruff format --check .
              python -m pytest -q
            '
