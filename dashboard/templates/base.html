<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TV Bot{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-indigo-600 focus:px-3 focus:py-1 focus:text-white text-sm">Skip to content</a>
  <header class="border-b border-slate-800 bg-slate-900/60">
    <nav aria-label="Main navigation" class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4 text-sm">
      <a href="/dashboard" class="font-semibold text-slate-100 hover:text-white">🎙️ TV Bot</a>
      <a href="/dashboard" {% if request.url.path == "/dashboard" %}aria-current="page" class="text-white font-medium"{% else %}class="text-slate-300 hover:text-white"{% endif %}>Dashboard</a>
      <a href="/leaderboard" {% if request.url.path == "/leaderboard" %}aria-current="page" class="text-white font-medium"{% else %}class="text-slate-300 hover:text-white"{% endif %}>Leaderboard</a>
      <a href="/queue" {% if request.url.path == "/queue" %}aria-current="page" class="text-white font-medium"{% else %}class="text-slate-300 hover:text-white"{% endif %}>Queue</a>
      <a href="/servers" {% if request.url.path == "/servers" %}aria-current="page" class="text-white font-medium"{% else %}class="text-slate-300 hover:text-white"{% endif %}>Servers</a>
      <div class="grow"></div>
      {% if user %}
        <span class="text-slate-400 text-xs">Signed in as <b>{{ user.username }}</b></span>
        <a href="/logout" class="text-slate-400 hover:text-white text-xs">Logout</a>
      {% else %}
        <a href="/login" class="text-slate-300 hover:text-white text-xs">Login with Discord</a>
      {% endif %}
    </nav>
  </header>
  <main id="main-content" class="max-w-4xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
